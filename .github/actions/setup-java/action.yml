name: Setup Java
description: Configure Java 17 and Gradle cache

runs:
  using: composite
  steps:
    - name: Set up Java 17
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: back/gradle/wrapper/gradle-wrapper.properties


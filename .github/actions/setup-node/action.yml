name: Setup Node.js
description: Configure Node.js and npm cache

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20.9.0'
        cache: npm
        cache-dependency-path: front/package-lock.json
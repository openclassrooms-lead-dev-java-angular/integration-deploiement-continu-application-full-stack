name: MicroCRM - CI

on:
  push:
    branches:
      - main
      - develop
      - preprod
      - ci/setup-github-actions

  pull_request:
    branches:
      - main
      - develop
      - preprod

  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microcrm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1 : BUILD AND TESTS
  # ==========================================
  test:
    name: Build and tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 2. Java 17
      - name: Set up Java 17
        uses: ./.github/actions/setup-java

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 4. Backend tests and JaCoCo
      - name: Build backend and generate JaCoCo report
        working-directory: back
        run: |
          chmod +x ./gradlew
          ./gradlew clean build jacocoTestReport --no-daemon

      # 5. Node.js
      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      # 6. Frontend dependencies
      - name: Install frontend dependencies
        working-directory: front
        run: npm ci --ignore-scripts

      # 7. Angular build
      - name: Build frontend
        working-directory: front
        run: ./node_modules/.bin/ng build --optimization

      # 8. Angular tests and LCOV
      - name: Run frontend tests with coverage
        working-directory: front
        run: ./node_modules/.bin/ng test --watch=false --browsers=ChromeHeadless --code-coverage

      # 9. Verify coverage reports
      - name: Verify coverage reports
        run: |
          test -f back/build/reports/jacoco/test/jacocoTestReport.xml
          test -f front/coverage/microcrm/lcov.info

      # 10. Upload coverage reports
      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports
          path: |
            back/build/reports/jacoco/test/jacocoTestReport.xml
            front/coverage/microcrm/lcov.info
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # JOB 2 : SONARQUBE CLOUD
  # ==========================================
  sonarqube:
    name: SonarQube Cloud analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Java 17
      - name: Set up Java 17
        uses: ./.github/actions/setup-java

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 4. Compile backend without rerunning tests
      - name: Compile backend
        working-directory: back
        run: |
          chmod +x ./gradlew
          ./gradlew classes --no-daemon

      # 5. Download coverage reports
      - name: Download coverage reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-reports
          path: .

      # 6. Verify downloaded reports
      - name: Verify downloaded reports
        shell: bash
        run: |
          echo "=== Downloaded artifact structure ==="
          find . -type f \( -name "jacocoTestReport.xml" -o -name "lcov.info" \)

          echo "=== Backend JaCoCo ==="
          test -f "back/build/reports/jacoco/test/jacocoTestReport.xml"
          echo "JaCoCo report found."

          echo "=== Frontend LCOV ==="
          test -f "front/coverage/microcrm/lcov.info"
          echo "LCOV report found."

          echo "All coverage reports are available."

      # 7. SonarQube Cloud analysis
      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info
            -Dsonar.java.binaries=back/build/classes/java/main

  # ==========================================
  # JOB 3 : BUILD AND DEPLOY
  # ==========================================
  build:
    name: Build and publish Docker images
    needs:
      - test
      - sonarqube
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Retrieving the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuring Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Connecting to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generating front-end tags
      - name: Extract frontend metadata
        id: meta-front
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-front
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      # 5. Front-end development and deployment
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/docker/production/Dockerfile
          push: true
          tags: ${{ steps.meta-front.outputs.tags }}
          labels: ${{ steps.meta-front.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Backend tag generation
      - name: Extract backend metadata
        id: meta-back
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-back
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      # 7. Development and deployment of the backend
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/docker/production/Dockerfile
          push: true
          tags: ${{ steps.meta-back.outputs.tags }}
          labels: ${{ steps.meta-back.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

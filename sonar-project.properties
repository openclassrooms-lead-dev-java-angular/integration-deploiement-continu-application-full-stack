# ==================================================
# Project identification
# ==================================================

sonar.projectKey=openclassrooms-lead-dev-java-angular_integration-deploiement-continu-application-full-stack
sonar.organization=openclassrooms-lead-dev-java-angular
sonar.projectName=MicroCRM
sonar.projectVersion=1.0

# ==================================================
# Source directories
# ==================================================

sonar.sources=back/src/main/java,front/src

# ==================================================
# Test directories
# ==================================================

sonar.tests=back/src/test/java,front/src

sonar.test.inclusions=back/src/test/java/**/*.java,front/src/**/*.spec.ts

# ==================================================
# Exclusions
# ==================================================

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# ==================================================
# Java configuration
# ==================================================

sonar.java.source=17
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test

# ==================================================
# Test reports
# ==================================================

sonar.junit.reportPaths=back/build/test-results/test

# ==================================================
# Coverage reports
# ==================================================

sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info

# ==================================================
# Encoding
# ==================================================

sonar.sourceEncoding=UTF-8
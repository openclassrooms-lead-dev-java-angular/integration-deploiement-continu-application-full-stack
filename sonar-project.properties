# ==================================================
# Project identification
# ==================================================

sonar.projectKey=VOTRE_ORGANISATION_microcrm
sonar.organization=VOTRE_ORGANISATION
sonar.projectName=MicroCRM
sonar.projectVersion=1.0

# ==================================================
# Source directories
# ==================================================

sonar.sources=back/src/main/java,front/src

# ==================================================
# Test directories
# ==================================================

sonar.tests=back/src/test/java
sonar.test.inclusions=**/*.spec.ts

# ==================================================
# Exclusions
# ==================================================

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts

# ==================================================
# Java configuration
# ==================================================

sonar.java.source=17
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test

# ==================================================
# Test reports
# ==================================================

sonar.junit.reportPaths=back/build/test-results/test

# ==================================================
# Coverage reports
# ==================================================

sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=front/coverage/**/lcov.info

# ==================================================
# Encoding
# ==================================================

sonar.sourceEncoding=UTF-8
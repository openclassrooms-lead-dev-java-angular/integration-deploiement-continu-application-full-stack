plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.adarshr.test-logger' version '4.0.0'

	// Code quality analysis
	id 'org.sonarqube' version '7.6.0.18749'

	// Tests coverage
	id 'jacoco'
}

group = 'com.openclassroom.devops.orion'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'ro.polak:spring-boot-data-fixtures:0.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'org.hsqldb:hsqldb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Sonar config
sonar {
	properties {
		property 'sonar.projectKey', 'openclassrooms-lead-dev-java-angular_integration-deploiement-continu-application-full-stack'
		property 'sonar.organization', 'openclassrooms-lead-dev-java-angular'
	}
}


// JaCoCo configuration
jacoco {
	toolVersion = "0.8.15"
}

// Configure test execution
tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

// Generate JaCoCo coverage reports
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')

	reports {
		xml.required = true
		xml.outputLocation = layout.buildDirectory.file(
				"reports/jacoco/test/jacocoTestReport.xml"
		)
		html.required = true
		csv.required = false
	}
}